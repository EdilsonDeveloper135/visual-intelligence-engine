# =============================================================================
# Visual Intelligence Engine — Docker Compose (profile "lite", default)
#
#   make install   -> INSTALL PHASE (Internet): build images, pull models
#   make up        -> RUN PHASE (offline): docker compose up -d --pull never --no-build
#
# Only the frontend publishes a port, and only on ${VIE_BIND_ADDRESS}.
# All internal networks are `internal: true` (no Internet egress at runtime).
# =============================================================================
name: vie

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging: *logging

# Settings shared by the API and the worker (same image, different command).
x-backend-env: &backend-env
  VIE_DATABASE_URL: postgresql+asyncpg://vie:${POSTGRES_PASSWORD:?run scripts/install.sh first}@postgres:5432/vie
  VIE_VISION_URL: http://vision:8000
  VIE_OLLAMA_URL: http://ollama:11434
  VIE_SECRET_KEY: ${VIE_SECRET_KEY:?run scripts/install.sh first}
  VIE_ACCESS_KEY: ${VIE_ACCESS_KEY:?run scripts/install.sh first}
  VIE_PORT: ${VIE_PORT:-8080}
  VIE_VLM_MODEL: ${VIE_VLM_MODEL:-qwen3-vl:2b-instruct}
  VIE_VLM_NUM_CTX: ${VIE_VLM_NUM_CTX:-4096}
  VIE_VLM_NUM_PREDICT: ${VIE_VLM_NUM_PREDICT:-768}
  VIE_VLM_MAX_SIDE_DOCUMENT: ${VIE_VLM_MAX_SIDE_DOCUMENT:-1280}
  VIE_VLM_MAX_SIDE_CAMERA: ${VIE_VLM_MAX_SIDE_CAMERA:-1024}
  VIE_VLM_MAX_OCR_CHARS: ${VIE_VLM_MAX_OCR_CHARS:-2500}
  VIE_VLM_TIMEOUT_S: ${VIE_VLM_TIMEOUT_S:-300}
  VIE_VLM_TEMPERATURE: ${VIE_VLM_TEMPERATURE:-0}
  VIE_VLM_SEED: ${VIE_VLM_SEED:-42}
  VIE_MAX_IMAGE_MB: ${VIE_MAX_IMAGE_MB:-20}
  VIE_MAX_PDF_MB: ${VIE_MAX_PDF_MB:-30}
  VIE_MAX_PDF_PAGES: ${VIE_MAX_PDF_PAGES:-30}
  VIE_MAX_FILES_PER_REQUEST: ${VIE_MAX_FILES_PER_REQUEST:-10}
  VIE_JOB_TIMEOUT_S: ${VIE_JOB_TIMEOUT_S:-600}
  VIE_STORAGE_QUOTA_GB: ${VIE_STORAGE_QUOTA_GB:-10}
  VIE_RETENTION_DAYS: ${VIE_RETENTION_DAYS:-0}
  VIE_CAMERA_MIN_OCR_INTERVAL_S: ${VIE_CAMERA_MIN_OCR_INTERVAL_S:-3}
  VIE_CAMERA_MIN_VLM_INTERVAL_S: ${VIE_CAMERA_MIN_VLM_INTERVAL_S:-60}
  VIE_CAMERA_AUTO_VLM: ${VIE_CAMERA_AUTO_VLM:-false}
  VIE_LOG_LEVEL: ${VIE_LOG_LEVEL:-INFO}
  TMPDIR: /data/staging

services:
  # ---------------------------------------------------------------------------
  # Visual memory + job queue (layer G). Internal network "core" only.
  # ---------------------------------------------------------------------------
  postgres:
    <<: *hardening
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    user: "70:70"
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=8m,uid=70,gid=70,mode=0775
      - /tmp:size=64m,uid=70,gid=70,mode=1777
    environment:
      POSTGRES_USER: vie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/install.sh first}
      POSTGRES_DB: vie
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=40", "-c", "work_mem=4MB",
              "-c", "maintenance_work_mem=32MB", "-c", "effective_cache_size=128MB",
              "-c", "log_min_duration_statement=2000"]
    volumes:
      - vie_pgdata:/var/lib/postgresql
    networks:
      - core
    deploy:
      resources:
        limits:
          cpus: "${VIE_DB_CPUS:-1}"
          memory: ${VIE_DB_MEM:-256m}
          pids: 256
    memswap_limit: ${VIE_DB_MEM:-256m}
    oom_score_adj: 300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vie -d vie -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # One-shot database migrations (api and worker wait for it).
  migrate:
    image: vie/backend:1.0.0
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["alembic", "upgrade", "head"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      <<: *backend-env
    networks:
      - core
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  # ---------------------------------------------------------------------------
  # Public API (layers A/G/H). Reachable only through the frontend proxy.
  # ---------------------------------------------------------------------------
  api:
    <<: *hardening
    image: vie/backend:1.0.0
    read_only: true
    tmpfs:
      - /tmp:size=32m,uid=10001,gid=10001,mode=1700
    environment:
      <<: *backend-env
    volumes:
      - vie_files:/data
    networks:
      - app
      - core
      - ml
    depends_on:
      migrate:
        condition: service_completed_successfully
      vision:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "${VIE_API_CPUS:-1.5}"
          memory: ${VIE_API_MEM:-288m}
          pids: 256
    memswap_limit: ${VIE_API_MEM:-288m}
    oom_score_adj: 500

  # ---------------------------------------------------------------------------
  # Pipeline worker (layers D/E/F/G): OCR lane + model lane.
  # ---------------------------------------------------------------------------
  worker:
    <<: *hardening
    image: vie/backend:1.0.0
    command: ["python", "-m", "vie.worker"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,uid=10001,gid=10001,mode=1700
    environment:
      <<: *backend-env
    volumes:
      - vie_files:/data
    networks:
      - core
      - ml
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "${VIE_WORKER_CPUS:-1.5}"
          memory: ${VIE_WORKER_MEM:-320m}
          pids: 256
    memswap_limit: ${VIE_WORKER_MEM:-320m}
    oom_score_adj: 600
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Vision engine + OCR engine (layers A/B/C). Decodes UNTRUSTED media.
  # No database access, no secrets, no egress, read-only root filesystem.
  # ---------------------------------------------------------------------------
  vision:
    <<: *hardening
    build:
      context: services/vision
      target: runtime
    image: vie/vision:1.0.0
    read_only: true
    tmpfs:
      - /tmp:size=128m,uid=10001,gid=10001,mode=1700
    environment:
      VIE_OCR_MODEL_SIZE: ${VIE_OCR_MODEL_SIZE:-small}
      VIE_OCR_THREADS: ${VIE_OCR_THREADS:-3}
      OMP_NUM_THREADS: ${VIE_OCR_THREADS:-3}
      VIE_MAX_IMAGE_PIXELS: ${VIE_MAX_IMAGE_PIXELS:-120000000}
      VIE_WORK_IMAGE_MAX_SIDE: ${VIE_WORK_IMAGE_MAX_SIDE:-3000}
      VIE_MAX_PDF_PAGES: ${VIE_MAX_PDF_PAGES:-30}
      VIE_MAX_UPLOAD_MB: ${VIE_MAX_VIDEO_MB:-100}
      VIE_LOG_LEVEL: ${VIE_LOG_LEVEL:-INFO}
    networks:
      - ml
    deploy:
      resources:
        limits:
          cpus: "${VIE_VISION_CPUS:-3}"
          memory: ${VIE_VISION_MEM:-768m}
          pids: 256
    memswap_limit: ${VIE_VISION_MEM:-768m}
    oom_score_adj: 800

  # ---------------------------------------------------------------------------
  # Multimodal inference (layer D). Non-root derived image, no egress.
  # ---------------------------------------------------------------------------
  ollama:
    <<: *hardening
    build:
      context: services/ollama
      args:
        OLLAMA_IMAGE: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    image: vie/ollama:0.40.17
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=10001,gid=10001,mode=1700
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${VIE_VLM_NUM_CTX:-4096}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "16"
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-0}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-f16}
      OLLAMA_NO_CLOUD: "1"
      # Passed through to the embedded llama-server:
      LLAMA_ARG_THREADS: ${VIE_VLM_NUM_THREAD:-6}
      LLAMA_ARG_THREADS_BATCH: ${VIE_VLM_NUM_THREAD:-6}
      LLAMA_ARG_CACHE_RAM: "0"   # no RAM prompt cache (it would grow up to 8 GB)
      VIE_VLM_MODEL: ${VIE_VLM_MODEL:-qwen3-vl:2b-instruct}
    volumes:
      - vie_ollama:/home/ollama/.ollama
    networks:
      - ml
    deploy:
      resources:
        limits:
          cpus: "${VIE_OLLAMA_CPUS:-6}"
          memory: ${VIE_OLLAMA_MEM:-3328m}
          pids: 512
    memswap_limit: ${VIE_OLLAMA_MEM:-3328m}
    oom_score_adj: 1000
    healthcheck:
      test: ["CMD", "/usr/local/bin/vie-healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # INSTALL PHASE ONLY: downloads models into the shared volume.
  #   docker compose --profile setup run --rm model-init
  # ---------------------------------------------------------------------------
  model-init:
    image: vie/ollama:0.40.17
    profiles: ["setup"]
    entrypoint: ["/usr/local/bin/vie-model-init"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=10001,gid=10001,mode=1700
    environment:
      VIE_VLM_MODELS_TO_PULL: ${VIE_VLM_MODELS_TO_PULL:-qwen3-vl:2b-instruct}
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - vie_ollama:/home/ollama/.ollama
    networks:
      - setup
    restart: "no"
    logging: *logging

networks:
  # Only network with a gateway at runtime; used by the frontend to publish its port.
  edge:
    name: vie_edge
  app:
    name: vie_app
    internal: true
  core:
    name: vie_core
    internal: true
  ml:
    name: vie_ml
    internal: true
  # Install phase only (model-init): has Internet access.
  setup:
    name: vie_setup

volumes:
  vie_pgdata:
    name: vie_pgdata
  vie_files:
    name: vie_files
  vie_ollama:
    name: vie_ollama
