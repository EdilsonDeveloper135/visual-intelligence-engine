# Test profile overlay:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --profile test run --rm system-tests
# Test runners share the frontend's network namespace, so they browse http://127.0.0.1:8080
# exactly like a user (same Host/Origin rules, secure context for the camera).
services:
  api:
    environment:
      VIE_EXTRA_ORIGINS: '["http://127.0.0.1:8080"]'

  system-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/Dockerfile
    image: vie/tests:1.0.0
    network_mode: "service:frontend"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      VIE_ACCESS_KEY: ${VIE_ACCESS_KEY}
      BASE_URL: http://127.0.0.1:8080
      SAMPLES_DIR: /samples
    volumes:
      - ./examples/generated:/samples:ro
      - ./tests/output:/results
    command: ["pytest", "-p", "no:cacheprovider", "-v", "system", "--junitxml=/results/system-junit.xml"]
    deploy:
      resources:
        limits:
          memory: 512m

  e2e:
    profiles: ["test"]
    build:
      context: tests/e2e
    image: vie/e2e:1.0.0
    network_mode: "service:frontend"
    shm_size: 512m
    environment:
      VIE_ACCESS_KEY: ${VIE_ACCESS_KEY}
      BASE_URL: http://127.0.0.1:8080
    volumes:
      - ./examples/generated:/samples:ro
      - ./tests/output:/results
    deploy:
      resources:
        limits:
          memory: 1536m
